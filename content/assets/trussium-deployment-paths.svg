<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Trussium deployment paths</title>
  <desc id="desc">Applications can run Trussium locally, with Helm on Kubernetes, or through the Trussium Operator.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#102a56} .head{font-size:30px;font-weight:700;fill:#fff} .label{font-size:24px;font-weight:700} .body{font-size:18px} .box{fill:#f7fbff;stroke:#0b6f83;stroke-width:3} .arrow{stroke:#102a56;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#102a56"/></marker></defs>
  <rect x="30" y="25" width="1140" height="70" rx="14" fill="#082653"/>
  <text x="600" y="70" text-anchor="middle" class="head">Choose your Trussium deployment path</text>
  <path d="M600 95 V135" class="arrow"/>
  <rect x="45" y="155" width="330" height="270" rx="16" class="box"/>
  <rect x="435" y="155" width="330" height="270" rx="16" class="box"/>
  <rect x="825" y="155" width="330" height="270" rx="16" class="box"/>
  <text x="210" y="205" text-anchor="middle" class="label">Local runtime</text>
  <text x="210" y="255" text-anchor="middle" class="body">CLI or Python entry point</text>
  <text x="210" y="290" text-anchor="middle" class="body">Fast development and tests</text>
  <text x="210" y="345" text-anchor="middle" class="body">Run the runtime directly</text>
  <text x="600" y="205" text-anchor="middle" class="label">Helm chart</text>
  <text x="600" y="255" text-anchor="middle" class="body">Direct Kubernetes install</text>
  <text x="600" y="290" text-anchor="middle" class="body">Values-based upgrades</text>
  <text x="600" y="345" text-anchor="middle" class="body">Installs the runtime workload</text>
  <text x="990" y="205" text-anchor="middle" class="label">Operator</text>
  <text x="990" y="255" text-anchor="middle" class="body">Reconciles TrussiumRuntime</text>
  <text x="990" y="290" text-anchor="middle" class="body">Status, events, lifecycle</text>
  <text x="990" y="345" text-anchor="middle" class="body">Uses Kubernetes custom resources</text>
  <text x="600" y="480" text-anchor="middle" class="body">Helm and Operator are separate projects; neither installs provider adapters.</text>
</svg>
