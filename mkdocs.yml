site_name: Trussium
site_description: Cloud-native, provider-neutral runtime for AI applications.
site_url: https://trussiumhq.github.io/
repo_url: https://github.com/trussiumhq
repo_name: trussiumhq
docs_dir: site-docs

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Runtime:
      - Overview: runtime/index.md
      - Architecture: runtime/architecture.md
      - Vision: runtime/VISION.md
      - Getting started:
          - CLI: runtime/CLI.md
          - API usage: runtime/API_USAGE.md
          - Packaging: runtime/PACKAGING.md
          - Self-hosting: runtime/SELF_HOSTING.md
          - Containers: runtime/CONTAINERS.md
          - Kubernetes deployment: runtime/KUBERNETES.md
      - SDKs:
          - Go SDK: runtime/GO_SDK.md
          - Python SDK: runtime/PYTHON_SDK.md
          - TypeScript SDK: runtime/TYPESCRIPT_SDK.md
      - Capabilities:
          - Availability: runtime/CAPABILITY_AVAILABILITY.md
          - Discovery: runtime/CAPABILITY_DISCOVERY.md
          - Execution pipeline: runtime/CAPABILITY_EXECUTION_PIPELINE.md
          - Health: runtime/CAPABILITY_HEALTH.md
          - Lifecycle: runtime/CAPABILITY_LIFECYCLE.md
          - Middleware: runtime/CAPABILITY_MIDDLEWARE.md
          - Registry: runtime/CAPABILITY_REGISTRY.md
          - Audio transcription: runtime/AUDIO_TRANSCRIPTION.md
          - Batch inference: runtime/BATCH_INFERENCE.md
          - Embeddings: runtime/EMBEDDINGS.md
          - Image generation: runtime/IMAGE_GENERATION.md
          - Moderation: runtime/MODERATION.md
          - Reranking: runtime/RERANKING.md
          - Tool execution: runtime/TOOL_EXECUTION.md
          - Video generation: runtime/VIDEO_GENERATION.md
      - Operations:
          - Health and readiness: runtime/HEALTH.md
          - Component health: runtime/COMPONENT_HEALTH.md
          - Metrics: runtime/METRICS.md
          - Tracing: runtime/TRACING.md
          - Operational logging: runtime/OPERATIONAL_LOGGING.md
          - Dashboards: runtime/DASHBOARDS.md
          - Alerting: runtime/ALERTING.md
          - Shutdown: runtime/SHUTDOWN.md
          - Lifecycle: runtime/LIFECYCLE.md
